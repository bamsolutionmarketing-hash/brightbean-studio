<div x-show="showUpload" x-cloak x-transition.opacity @keydown.escape.window="showUpload = false"
     class="fixed inset-0 bg-stone-900/40 flex items-center justify-center z-50 p-4">
  <div @click.away="showUpload = false"
       class="bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto"
       x-data="{ preset: 'custom', name: '', url: '' }">

    <form method="post" action="{% url 'tools:upload' workspace_id=workspace_id %}" class="p-6">
      {% csrf_token %}

      <!-- Header -->
      <div class="flex items-center justify-between mb-5">
        <div>
          <h2 class="text-base font-semibold text-stone-900">Add a Tool</h2>
          <p class="text-xs text-stone-500 mt-0.5">Paste cookies from J2TEAM Cookies or EditThisCookie.</p>
        </div>
        <button type="button" @click="showUpload = false"
                class="w-8 h-8 rounded-lg text-stone-400 hover:text-stone-700 hover:bg-stone-100 inline-flex items-center justify-center">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <!-- Preset picker -->
      <label class="block text-xs font-semibold text-stone-700 mb-2">Platform</label>
      <div class="grid grid-cols-3 gap-2 mb-5">
        {% for p in presets %}
        <label class="cursor-pointer">
          <input type="radio" name="platform_key" value="{{ p.key }}" x-model="preset"
                 @change="if (preset !== 'custom') { name = '{{ p.name|escapejs }}'; url = '{{ p.url|escapejs }}'; }"
                 class="hidden peer" {% if forloop.first %}checked{% endif %}>
          <div class="border border-stone-200 rounded-xl p-3 text-center peer-checked:border-orange-400 peer-checked:bg-orange-50 transition-all hover:border-stone-300">
            <div class="text-xl mb-1">{{ p.icon_emoji }}</div>
            <div class="text-[11px] font-medium text-stone-700">{{ p.name }}</div>
          </div>
        </label>
        {% endfor %}
      </div>

      <!-- Name -->
      <label class="block text-xs font-semibold text-stone-700 mb-1">Display name</label>
      <input type="text" name="name" x-model="name" required maxlength="120"
             placeholder="Canva Pro – Design Team"
             class="form-input-styled mb-3 w-full">

      <!-- URL -->
      <label class="block text-xs font-semibold text-stone-700 mb-1">Home URL</label>
      <input type="url" name="url" x-model="url" required
             placeholder="https://www.canva.com"
             class="form-input-styled mb-3 w-full">

      <!-- Description -->
      <label class="block text-xs font-semibold text-stone-700 mb-1">
        Description <span class="text-stone-400 font-normal">— optional</span>
      </label>
      <input type="text" name="description" maxlength="300"
             placeholder="Shared Canva Pro account for the design team"
             class="form-input-styled mb-3 w-full">

      <!-- Group -->
      <label class="block text-xs font-semibold text-stone-700 mb-1">
        Access group <span class="text-stone-400 font-normal">— leave empty for public</span>
      </label>
      <select name="group_id" class="form-input-styled mb-3 w-full">
        <option value="">Public — available to all members</option>
        {% for g in all_groups %}
        <option value="{{ g.id }}">{{ g.icon_emoji }} {{ g.name }}</option>
        {% endfor %}
      </select>

      <!-- Cookies JSON -->
      <label class="block text-xs font-semibold text-stone-700 mb-1">
        Cookies JSON
        <a href="https://chromewebstore.google.com/detail/j2team-cookies/okpeabepajdgiepelmhkfhkjlhhmofma"
           target="_blank" rel="noopener" class="text-orange-600 font-medium ml-1 hover:underline">Get J2TEAM ↗</a>
      </label>
      <textarea name="cookies_json" required rows="6"
                placeholder='Paste JSON from J2TEAM Cookies or EditThisCookie…'
                class="form-input-styled w-full font-mono text-xs"></textarea>
      <p class="text-[11px] text-stone-400 mt-1.5 leading-relaxed">
        Open J2TEAM on the platform's tab → Export → copy the JSON → paste it here.
        Cookies are encrypted at rest and never exposed to the client.
      </p>

      <!-- Footer -->
      <div class="flex items-center justify-end gap-2 mt-6 pt-4 border-t border-stone-100">
        <button type="button" @click="showUpload = false"
                class="px-4 py-1.5 text-sm font-medium text-stone-600 hover:bg-stone-50 rounded-full">
          Cancel
        </button>
        <button type="submit"
                class="inline-flex items-center gap-1.5 px-4 py-1.5 text-sm font-semibold text-orange-600 bg-orange-50 border border-orange-200 rounded-full hover:bg-orange-100 hover:border-orange-300 transition-all">
          Save tool
        </button>
      </div>
    </form>
  </div>
</div>
