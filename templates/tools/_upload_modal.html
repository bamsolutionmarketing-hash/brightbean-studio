<div x-show="showUpload" x-cloak @keydown.escape.window="showUpload = false"
     class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
  <div @click.away="showUpload = false"
       class="bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto">

    <form method="post" action="{% url 'tools:upload' workspace_id=workspace_id %}" class="p-6"
          x-data="{ preset: 'custom', name: '', url: '' }">
      {% csrf_token %}

      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-stone-900">Thêm Tool mới</h2>
        <button type="button" @click="showUpload = false" class="text-stone-400 hover:text-stone-700">✕</button>
      </div>

      <!-- Preset picker -->
      <label class="block text-xs font-semibold text-stone-700 mb-2">Chọn platform</label>
      <div class="grid grid-cols-3 gap-2 mb-4">
        {% for p in presets %}
        <label class="cursor-pointer">
          <input type="radio" name="platform_key" value="{{ p.key }}" x-model="preset"
                 @change="if (preset !== 'custom') { name = '{{ p.name|escapejs }}'; url = '{{ p.url|escapejs }}'; }"
                 class="hidden peer" {% if forloop.first %}checked{% endif %}>
          <div class="border border-stone-200 rounded-lg p-3 text-center peer-checked:border-orange-500 peer-checked:bg-orange-50 transition-all">
            <div class="text-2xl mb-1">{{ p.icon_emoji }}</div>
            <div class="text-xs font-medium text-stone-700">{{ p.name }}</div>
          </div>
        </label>
        {% endfor %}
      </div>

      <!-- Name -->
      <label class="block text-xs font-semibold text-stone-700 mb-1">Tên hiển thị</label>
      <input type="text" name="name" x-model="name" required maxlength="120"
             placeholder="VD: Canva Pro Team"
             class="form-input-styled mb-3 w-full">

      <!-- URL -->
      <label class="block text-xs font-semibold text-stone-700 mb-1">URL trang chủ</label>
      <input type="url" name="url" x-model="url" required
             placeholder="https://www.canva.com"
             class="form-input-styled mb-3 w-full">

      <!-- Description -->
      <label class="block text-xs font-semibold text-stone-700 mb-1">Mô tả (tuỳ chọn)</label>
      <input type="text" name="description" maxlength="300"
             placeholder="Tài khoản Canva Pro team thiết kế"
             class="form-input-styled mb-3 w-full">

      <!-- Group -->
      <label class="block text-xs font-semibold text-stone-700 mb-1">
        Group (phân quyền)
        <span class="text-stone-400 font-normal">— bỏ trống = public</span>
      </label>
      <select name="group_id" class="form-input-styled mb-3 w-full">
        <option value="">🔓 Public (mọi member dùng được)</option>
        {% for g in all_groups %}
        <option value="{{ g.id }}">{{ g.icon_emoji }} {{ g.name }}</option>
        {% endfor %}
      </select>

      <!-- Cookies JSON -->
      <label class="block text-xs font-semibold text-stone-700 mb-1">
        Cookies JSON
        <a href="https://chromewebstore.google.com/detail/j2team-cookies/okpeabepajdgiepelmhkfhkjlhhmofma"
           target="_blank" class="text-orange-600 font-normal ml-1 underline">J2TEAM extension ↗</a>
      </label>
      <textarea name="cookies_json" required rows="6"
                placeholder='Paste JSON từ J2TEAM Cookies hoặc EditThisCookie...'
                class="form-input-styled w-full font-mono text-xs"></textarea>
      <p class="text-[11px] text-stone-400 mt-1">
        💡 Bật J2TEAM trên tab Canva → Export → copy → paste vào đây.
      </p>

      <div class="flex items-center justify-end gap-2 mt-5 pt-4 border-t border-stone-100">
        <button type="button" @click="showUpload = false"
                class="px-4 py-1.5 text-sm text-stone-600 hover:bg-stone-50 rounded-full">
          Huỷ
        </button>
        <button type="submit"
                class="px-4 py-1.5 text-sm font-semibold text-white bg-orange-500 hover:bg-orange-600 rounded-full">
          Lưu tool
        </button>
      </div>
    </form>
  </div>
</div>
